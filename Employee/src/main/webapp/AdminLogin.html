<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Employee Leave Management System</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

    position:relative;

    overflow:hidden;
}


/* =========================
   BACKGROUND SHAPES
========================= */

.circle-one{

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    background:rgba(255,255,255,0.07);

    top:-180px;
    left:-130px;
}


.circle-two{

    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    bottom:-220px;
    right:-150px;
}


.circle-three{

    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:rgba(255,255,255,0.04);

    top:15%;
    right:12%;
}


/* =========================
   LOGIN CONTAINER
========================= */

.container{

    width:420px;

    max-width:92%;

    position:relative;

    z-index:5;

    background:rgba(255,255,255,0.96);

    padding:35px;

    border-radius:20px;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.30);

}


/* =========================
   ADMIN ICON
========================= */

.admin-icon{

    width:75px;
    height:75px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#fee2e2;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:36px;

    box-shadow:
    0 8px 20px rgba(220,53,69,0.15);
}


/* =========================
   HEADING
========================= */

h1{

    text-align:center;

    color:#111827;

    font-size:27px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#6b7280;

    font-size:13px;

    line-height:1.5;

    margin-bottom:28px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:20px;

}


label{

    display:block;

    margin-bottom:8px;

    font-size:13px;

    font-weight:bold;

    color:#374151;

}


/* =========================
   INPUT WRAPPER
========================= */

.input-box{

    position:relative;

}


.input-icon{

    position:absolute;

    left:13px;

    top:50%;

    transform:translateY(-50%);

    font-size:17px;

}


/* =========================
   INPUT
========================= */

input[type=text],
input[type=password]{

    width:100%;

    padding:13px 42px;

    border:1px solid #d1d5db;

    border-radius:9px;

    font-size:14px;

    color:#111827;

    background:#f9fafb;

    outline:none;

    transition:0.3s;

}


input[type=text]:focus,
input[type=password]:focus{

    border-color:#2563eb;

    background:white;

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.10);
}


/* =========================
   PASSWORD EYE
========================= */

.password-toggle{

    position:absolute;

    right:13px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    font-size:17px;

    color:#6b7280;

}


.password-toggle:hover{

    color:#2563eb;

}


/* =========================
   LOGIN BUTTON
========================= */

input[type=submit]{

    width:100%;

    padding:13px;

    margin-top:5px;

    background:linear-gradient(
        135deg,
        #dc3545,
        #b91c1c
    );

    color:white;

    border:none;

    border-radius:9px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 6px 15px rgba(220,53,69,0.25);

}


input[type=submit]:hover{

    transform:translateY(-2px);

    background:linear-gradient(
        135deg,
        #bb2d3b,
        #991b1b
    );

    box-shadow:
    0 10px 20px rgba(220,53,69,0.30);
}


input[type=submit]:active{

    transform:translateY(0);

}


/* =========================
   SECURITY MESSAGE
========================= */

.security{

    margin-top:18px;

    padding:11px;

    background:#f8fafc;

    border:1px solid #e5e7eb;

    border-radius:8px;

    text-align:center;

    color:#6b7280;

    font-size:11px;

}


/* =========================
   BACK LINK
========================= */

.back{

    text-align:center;

    margin-top:22px;

}


.back a{

    text-decoration:none;

    color:#2563eb;

    font-size:13px;

    font-weight:bold;

    transition:0.3s;

}


.back a:hover{

    color:#1d4ed8;

    text-decoration:underline;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:20px;

    padding-top:18px;

    border-top:1px solid #e5e7eb;

    color:#9ca3af;

    font-size:11px;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:500px){

    body{

        padding:20px;

        overflow:auto;

    }


    .container{

        width:100%;

        padding:28px 22px;

    }


    h1{

        font-size:24px;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="circle-one"></div>

<div class="circle-two"></div>

<div class="circle-three"></div>



<!-- =========================
     LOGIN CONTAINER
========================= -->

<div class="container">


    <!-- ADMIN ICON -->

    <div class="admin-icon">
        👨‍💼
    </div>


    <!-- TITLE -->

    <h1>
        Admin Login
    </h1>


    <p class="subtitle">

        Employee Leave Management System
        <br>

        Sign in to access the administration panel.

    </p>



    <!-- =========================
         LOGIN FORM
    ========================== -->

    <form action="alog" method="post">


        <!-- USERNAME -->

        <div class="form-group">

            <label for="username">
                Username
            </label>


            <div class="input-box">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required>

            </div>

        </div>



        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>


            <div class="input-box">

                <span class="input-icon">
                    🔒
                </span>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required>


                <span
                    class="password-toggle"
                    onclick="togglePassword()"
                    id="eye">

                    👁

                </span>

            </div>

        </div>



        <!-- LOGIN -->

        <input
            type="submit"
            value="Login as Administrator →">


    </form>



    <!-- SECURITY -->

    <div class="security">

        🔐 &nbsp;
        Secure administrator access

    </div>



    <!-- BACK -->

    <div class="back">

        <a href="Inpute.html">
            ← Back to Login Selection
        </a>

    </div>



    <!-- FOOTER -->

    <div class="footer">

        © 2026 Employee Leave Management System

        <br>

        Admin Portal

    </div>


</div>



<!-- =========================
     PASSWORD SCRIPT
========================= -->

<script>

function togglePassword(){

    var password =
        document.getElementById("password");

    var eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.innerHTML = "🙈";

    }
    else{

        password.type = "password";

        eye.innerHTML = "👁";

    }

}

</script>


</body>

</html>
