<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Update Profile | Employee Leave Management System</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

    padding:25px;

    position:relative;

    overflow:hidden;

}


/* =========================
   BACKGROUND CIRCLES
========================= */

body::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-190px;
    left:-130px;

}


body::after{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    bottom:-220px;
    right:-150px;

}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:520px;

    max-width:95%;

    position:relative;

    z-index:2;

    background:rgba(255,255,255,0.98);

    padding:35px;

    border-radius:22px;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.30);

}


/* =========================
   HEADER
========================= */

.header{

    text-align:center;

    margin-bottom:25px;

}


/* =========================
   ICON
========================= */

.profile-icon{

    width:70px;
    height:70px;

    margin:0 auto 15px;

    border-radius:50%;

    background:#dbeafe;

    color:#2563eb;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:32px;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.20);

}


/* =========================
   TITLE
========================= */

h1{

    color:#111827;

    font-size:26px;

    margin-bottom:7px;

}


.subtitle{

    color:#6b7280;

    font-size:13px;

}


/* =========================
   FORM
========================= */

.form-group{

    margin-bottom:17px;

}


label{

    display:block;

    margin-bottom:7px;

    color:#374151;

    font-size:13px;

    font-weight:bold;

}


/* =========================
   INPUT
========================= */

input{

    width:100%;

    padding:12px 13px;

    border:1px solid #d1d5db;

    border-radius:9px;

    background:#f9fafb;

    color:#111827;

    font-size:14px;

    outline:none;

    transition:0.3s;

}


input:focus{

    border-color:#2563eb;

    background:white;

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.12);

}


/* =========================
   EMPLOYEE ID
========================= */

input[name="eid"]{

    background:#f3f4f6;

}


/* =========================
   UPDATE BUTTON
========================= */

.submit-btn{

    width:100%;

    padding:13px;

    margin-top:8px;

    border:none;

    border-radius:9px;

    background:
    linear-gradient(135deg,#2563eb,#1d4ed8);

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 8px 18px rgba(37,99,235,0.25);

}


.submit-btn:hover{

    background:
    linear-gradient(135deg,#1d4ed8,#1e40af);

    transform:translateY(-2px);

    box-shadow:
    0 12px 25px rgba(37,99,235,0.30);

}


/* =========================
   BACK BUTTON
========================= */

.back{

    text-align:center;

    margin-top:20px;

}


.back a{

    text-decoration:none;

    color:#2563eb;

    font-size:13px;

    font-weight:bold;

}


.back a:hover{

    color:#1d4ed8;

    text-decoration:underline;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:22px;

    padding-top:17px;

    border-top:1px solid #e5e7eb;

    color:#9ca3af;

    font-size:11px;

    line-height:1.6;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:550px){

    body{

        padding:15px;

    }

    .container{

        padding:28px 20px;

    }

    h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">


    <!-- HEADER -->

    <div class="header">


        <div class="profile-icon">
            👤
        </div>


        <h1>
            Update Profile
        </h1>


        <p class="subtitle">
            Update your employee information
        </p>


    </div>


    <!-- =========================
         FORM
    ========================= -->

    <form action="UpdateProfile" method="post">


        <!-- EMPLOYEE ID -->

        <div class="form-group">

            <label for="eid">
                Employee ID
            </label>

            <input
                type="text"
                id="eid"
                name="eid"
                placeholder="Enter Employee ID"
                required>

        </div>


        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Employee Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter Employee Name"
                required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter Email Address"
                required>

        </div>


        <!-- MOBILE -->

        <div class="form-group">

            <label for="mobile">
                Mobile Number
            </label>

            <input
                type="tel"
                id="mobile"
                name="mobile"
                placeholder="Enter 10 Digit Mobile Number"
                maxlength="10"
                pattern="[0-9]{10}"
                required>

        </div>


        <!-- DEPARTMENT -->

        <div class="form-group">

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter Department"
                required>

        </div>


        <!-- DESIGNATION -->

        <div class="form-group">

            <label for="designation">
                Designation
            </label>

            <input
                type="text"
                id="designation"
                name="designation"
                placeholder="Enter Designation"
                required>

        </div>


        <!-- SUBMIT -->

        <input
            type="submit"
            value="Update Profile"
            class="submit-btn">


    </form>


    <!-- BACK -->

    <div class="back">

        <a href="EmployeeHome.jsp">
            ← Back to Employee Home
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        Employee Leave Management System
        <br>

        © 2026 All Rights Reserved

    </div>


</div>


</body>

</html>
