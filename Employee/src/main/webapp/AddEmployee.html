<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Add Employee | Employee Leave Management System</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    background:
    linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

    display:flex;

    align-items:center;

    justify-content:center;

    padding:30px;

    position:relative;

    overflow:auto;
}


/* =========================
   BACKGROUND CIRCLES
========================= */

.circle-one{

    position:fixed;

    width:400px;
    height:400px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    top:-180px;
    left:-130px;
}


.circle-two{

    position:fixed;

    width:450px;
    height:450px;

    border-radius:50%;

    background:rgba(255,255,255,0.05);

    bottom:-220px;
    right:-150px;
}


/* =========================
   MAIN CONTAINER
========================= */

.container{

    width:650px;

    max-width:100%;

    background:rgba(255,255,255,0.97);

    border-radius:20px;

    padding:32px 38px;

    position:relative;

    z-index:5;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.30);

}


/* =========================
   HEADER
========================= */

.header{

    text-align:center;

    margin-bottom:25px;

    padding-bottom:20px;

    border-bottom:1px solid #e5e7eb;
}


.header-icon{

    width:65px;
    height:65px;

    margin:0 auto 12px;

    border-radius:16px;

    background:#dbeafe;

    color:#2563eb;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:30px;

}


h2{

    color:#111827;

    font-size:26px;

    margin-bottom:6px;

}


.header p{

    color:#6b7280;

    font-size:13px;

}


/* =========================
   FORM GRID
========================= */

.form-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:18px 20px;

}


/* =========================
   FORM GROUP
========================= */

.form-group{

    display:flex;

    flex-direction:column;

}


.form-group.full{

    grid-column:1 / -1;

}


label{

    font-size:12px;

    font-weight:bold;

    color:#374151;

    margin-bottom:7px;

}


/* =========================
   INPUT WRAPPER
========================= */

.input-box{

    position:relative;

}


.input-icon{

    position:absolute;

    left:12px;

    top:50%;

    transform:translateY(-50%);

    font-size:16px;

}


/* =========================
   INPUTS
========================= */

input[type=text],
input[type=email],
input[type=password]{

    width:100%;

    height:44px;

    padding:10px 12px 10px 38px;

    border:1px solid #d1d5db;

    border-radius:9px;

    background:#f9fafb;

    color:#111827;

    font-size:13px;

    outline:none;

    transition:0.3s;

}


input[type=text]:focus,
input[type=email]:focus,
input[type=password]:focus{

    border-color:#2563eb;

    background:white;

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.10);

}


/* =========================
   PASSWORD EYE
========================= */

.password-toggle{

    position:absolute;

    right:12px;

    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    color:#6b7280;

    font-size:16px;

}


.password-toggle:hover{

    color:#2563eb;

}


/* =========================
   MOBILE VALIDATION
========================= */

.mobile-hint{

    font-size:10px;

    color:#9ca3af;

    margin-top:5px;

}


/* =========================
   BUTTON AREA
========================= */

.button-area{

    display:flex;

    gap:12px;

    margin-top:25px;

}


/* =========================
   SUBMIT BUTTON
========================= */

.submit-btn{

    flex:1;

    height:45px;

    border:none;

    border-radius:9px;

    background:
    linear-gradient(135deg,#2563eb,#1d4ed8);

    color:white;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 6px 15px rgba(37,99,235,0.22);

}


.submit-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 10px 20px rgba(37,99,235,0.28);

}


/* =========================
   RESET BUTTON
========================= */

.reset-btn{

    width:120px;

    height:45px;

    border:1px solid #d1d5db;

    border-radius:9px;

    background:#f8fafc;

    color:#374151;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

}


.reset-btn:hover{

    background:#e5e7eb;

}


/* =========================
   BACK LINK
========================= */

.back{

    display:block;

    text-align:center;

    margin-top:20px;

    padding-top:18px;

    border-top:1px solid #e5e7eb;

    text-decoration:none;

    color:#2563eb;

    font-size:13px;

    font-weight:bold;

}


.back:hover{

    color:#1d4ed8;

    text-decoration:underline;

}


/* =========================
   SECURITY INFO
========================= */

.security{

    text-align:center;

    margin-top:12px;

    color:#9ca3af;

    font-size:10px;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:650px){

    body{

        padding:20px 12px;

    }


    .container{

        padding:28px 22px;

    }


    .form-grid{

        grid-template-columns:1fr;

    }


    .form-group.full{

        grid-column:auto;

    }

}


@media(max-width:450px){

    h2{

        font-size:23px;

    }


    .button-area{

        flex-direction:column;

    }


    .reset-btn{

        width:100%;

    }

}

</style>

</head>


<body>


<!-- BACKGROUND -->

<div class="circle-one"></div>

<div class="circle-two"></div>



<!-- =========================
     MAIN CONTAINER
========================= -->

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <div class="header-icon">
            👤
        </div>

        <h2>
            Add New Employee
        </h2>

        <p>
            Employee Leave Management System
        </p>

    </div>



    <!-- =========================
         FORM
    ========================= -->

    <form action="addemployee" method="post">


        <div class="form-grid">


            <!-- EMPLOYEE ID -->

            <div class="form-group">

                <label for="eid">
                    Employee ID
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🆔
                    </span>

                    <input
                        type="text"
                        id="eid"
                        name="eid"
                        placeholder="Enter employee ID"
                        required>

                </div>

            </div>



            <!-- EMPLOYEE NAME -->

            <div class="form-group">

                <label for="ename">
                    Employee Name
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        id="ename"
                        name="ename"
                        placeholder="Enter full name"
                        required>

                </div>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        ✉️
                    </span>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required>

                </div>

            </div>



            <!-- MOBILE -->

            <div class="form-group">

                <label for="mobile">
                    Mobile Number
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        📱
                    </span>

                    <input
                        type="text"
                        id="mobile"
                        name="mobile"
                        placeholder="10 digit mobile number"
                        maxlength="10"
                        pattern="[0-9]{10}"
                        title="Enter exactly 10 digits"
                        required>

                </div>

                <span class="mobile-hint">
                    Enter exactly 10 digits
                </span>

            </div>



            <!-- DEPARTMENT -->

            <div class="form-group">

                <label for="department">
                    Department
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🏢
                    </span>

                    <input
                        type="text"
                        id="department"
                        name="department"
                        placeholder="e.g. IT, HR, Finance"
                        required>

                </div>

            </div>



            <!-- DESIGNATION -->

            <div class="form-group">

                <label for="designation">
                    Designation
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        💼
                    </span>

                    <input
                        type="text"
                        id="designation"
                        name="designation"
                        placeholder="e.g. Developer, Manager"
                        required>

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="form-group full">

                <label for="password">
                    Login Password
                </label>

                <div class="input-box">

                    <span class="input-icon">
                        🔒
                    </span>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create employee login password"
                        required>

                    <span
                        class="password-toggle"
                        id="eye"
                        onclick="togglePassword()">

                        👁

                    </span>

                </div>

            </div>


        </div>



        <!-- BUTTONS -->

        <div class="button-area">

            <input
                type="reset"
                value="Clear Form"
                class="reset-btn">


            <input
                type="submit"
                value="Add Employee →"
                class="submit-btn">

        </div>


    </form>



    <!-- BACK -->

    <a href="LoginHome.jsp" class="back">

        ← Back to Admin Home

    </a>


    <!-- SECURITY -->

    <div class="security">

        🔐 Employee information is securely managed by the administrator.

    </div>


</div>



<!-- =========================
     PASSWORD SCRIPT
========================= -->

<script>

function togglePassword(){

    var password =
        document.getElementById("password");

    var eye =
        document.getElementById("eye");


    if(password.type === "password"){

        password.type = "text";

        eye.innerHTML = "🙈";

    }
    else{

        password.type = "password";

        eye.innerHTML = "👁";

    }

}

</script>


</body>

</html>
