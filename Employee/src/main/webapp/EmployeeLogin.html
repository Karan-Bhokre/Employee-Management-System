<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Employee Login | Employee Leave Management System</title>


<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================
   BODY
========================= */

body{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
    linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);

    padding:20px;

    position:relative;

    overflow:hidden;

}


/* =========================
   BACKGROUND CIRCLES
========================= */

body::before{

    content:"";

    position:absolute;

    width:400px;
    height:400px;

    border-radius:50%;

    background:rgba(255,255,255,0.08);

    top:-180px;
    left:-120px;

}


body::after{

    content:"";

    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;

    background:rgba(255,255,255,0.06);

    bottom:-220px;
    right:-150px;

}


/* =========================
   LOGIN CARD
========================= */

.container{

    width:420px;

    max-width:95%;

    position:relative;

    z-index:2;

    background:rgba(255,255,255,0.97);

    padding:40px 35px;

    border-radius:22px;

    box-shadow:
    0 25px 60px rgba(0,0,0,0.30);

}


/* =========================
   LOGIN ICON
========================= */

.login-icon{

    width:75px;
    height:75px;

    margin:0 auto 18px;

    border-radius:50%;

    background:#dbeafe;

    color:#2563eb;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:36px;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.20);

}


/* =========================
   HEADING
========================= */

h1{

    text-align:center;

    color:#111827;

    font-size:27px;

    margin-bottom:8px;

}


.subtitle{

    text-align:center;

    color:#6b7280;

    font-size:13px;

    margin-bottom:30px;

}


/* =========================
   LABEL
========================= */

label{

    display:block;

    color:#374151;

    font-size:13px;

    font-weight:bold;

    margin-bottom:8px;

}


/* =========================
   INPUT GROUP
========================= */

.input-group{

    margin-bottom:20px;

}


/* =========================
   INPUT
========================= */

.input-group input{

    width:100%;

    padding:13px 14px;

    border:1px solid #d1d5db;

    border-radius:9px;

    font-size:14px;

    color:#111827;

    background:#f9fafb;

    outline:none;

    transition:0.3s;

}


.input-group input:focus{

    border-color:#2563eb;

    background:white;

    box-shadow:
    0 0 0 3px rgba(37,99,235,0.12);

}


/* =========================
   LOGIN BUTTON
========================= */

.login-btn{

    width:100%;

    padding:13px;

    border:none;

    border-radius:9px;

    background:
    linear-gradient(135deg,#2563eb,#1d4ed8);

    color:white;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 8px 18px rgba(37,99,235,0.25);

}


.login-btn:hover{

    background:
    linear-gradient(135deg,#1d4ed8,#1e40af);

    transform:translateY(-2px);

    box-shadow:
    0 12px 25px rgba(37,99,235,0.30);

}


/* =========================
   BACK LINK
========================= */

.back{

    text-align:center;

    margin-top:22px;

}


.back a{

    text-decoration:none;

    color:#2563eb;

    font-size:13px;

    font-weight:bold;

}


.back a:hover{

    color:#1d4ed8;

    text-decoration:underline;

}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:25px;

    padding-top:18px;

    border-top:1px solid #e5e7eb;

    color:#9ca3af;

    font-size:11px;

    line-height:1.6;

}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:450px){

    .container{

        padding:30px 22px;

    }

    h1{

        font-size:24px;

    }

    .login-icon{

        width:65px;

        height:65px;

        font-size:30px;

    }

}

</style>

</head>


<body>


<!-- =========================
     LOGIN CONTAINER
========================= -->

<div class="container">


    <!-- ICON -->

    <div class="login-icon">
        👤
    </div>


    <!-- TITLE -->

    <h1>
        Employee Login
    </h1>


    <p class="subtitle">
        Login to manage your leave requests
    </p>


    <!-- LOGIN FORM -->

    <form action="EmployeeLogin" method="post">


        <!-- EMAIL -->

        <div class="input-group">

            <label for="email">
                Email Address
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>


        <!-- PASSWORD -->

        <div class="input-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required>

        </div>


        <!-- LOGIN BUTTON -->

        <input
            type="submit"
            value="Login →"
            class="login-btn">


    </form>


    <!-- BACK -->

    <div class="back">

        <a href="Inpute.html">
            ← Back to Login Selection
        </a>

    </div>


    <!-- FOOTER -->

    <div class="footer">

        Employee Leave Management System
        <br>

        © 2026 All Rights Reserved

    </div>


</div>


</body>

</html>
